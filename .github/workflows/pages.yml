name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble demo site
        run: |
          mkdir -p _site
          cp demo.html swipe-slider.js swipe-slider.css swipe3.js _site/
          printf '%s\n' '<!DOCTYPE html>' '<meta charset="utf-8">' '<meta http-equiv="refresh" content="0; url=demo.html">' '<title>Swipe Slider</title>' '<p><a href="demo.html">Demo</a></p>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
