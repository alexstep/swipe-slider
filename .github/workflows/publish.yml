# Publishes pure-swipe-slider with npm Trusted Publishing (OIDC).
# On npmjs.com, the Trusted Publisher workflow filename is publish.yml.
# Leave the environment name empty. Allow direct `npm publish`.
# No npm token is used.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Pinned action and pinned Bun. Replaces curl | bash in the OIDC job.
      # 1.4.3 is the smallest gzip among Bun 1.1.45–1.4.3 on this source.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Require the tag to match package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}."
            exit 1
          fi

      - name: Require npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1

      - name: Install brotli
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm publish
