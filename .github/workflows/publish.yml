# Publishes pure-swipe-slider with npm Trusted Publishing (OIDC).
# On npmjs.com, the Trusted Publisher workflow filename is publish.yml.
# Leave the environment name empty. Allow direct `npm publish`.
# No npm token is used.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require the tag to match package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}."
            exit 1
          fi

      - name: Require npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm publish
